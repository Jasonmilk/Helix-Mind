[package]
name = "helix-mind-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
helix-mind-core = { path = "../helix-mind-core" }
helix-mind-wal = { path = "../helix-mind-wal" }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
petgraph = "0.6"
moka = { version = "0.12", features = ["sync"] }
ringbuf = "0.4"
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1"
# P6-1 (F7): Parquet 名实相符——真列式（Apache Arrow 官方 Rust 生态）。
# 注意：不直接依赖 `arrow`（其 compute feature 引入 arrow-arith，与 chrono 0.4.45 存在
# `quarter()` trait 冲突，arrow-arith 53.4.0 已知 E0034）。改用 arrow-array/schema 基础库。
parquet = "53"
arrow-array = "53"
arrow-schema = "53"
