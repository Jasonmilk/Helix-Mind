[package]
name = "helix-mind-federation"
version = "0.1.0"
edition = "2021"

[dependencies]
helix-mind-core = { path = "../helix-mind-core" }
helix-mind-storage = { path = "../helix-mind-storage" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
sha2 = "0.10"
tracing = "0.1"
hex = "0.4"