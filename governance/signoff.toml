# 合拢签收（机器可读）—— 屏不能自签（C-069：phyt-DNA DNA.md:44 守卫不自签），
# 但"人签了"这件事必须**落成状态位**，否则签完机器侧零消费者：C-062 的
# 「合拢完成 ⇒ 必须回来做 HITL 观测」就永远等不到原子条件。
[convergence]
signed      = true
signed_by   = "gardener"
signed_at   = "2026-11-03"
scope       = "合拢达标（分项由 convergence-screen.sh 判；此文件只记录人签，不代替判据）"
successor   = "进入 HITL 观测/就绪评估态（不是立刻实现应答者注册）；持久化是 ≥50 的前置"

# H0 裁定（园丁 2026-11-03，形态 A：可枚举清单；否决 C=宽条件）
# 只覆盖清单内命名；列不出的表面仍靠软记录，**不宣称 100%**。
[managed_naming]
mode            = "A"
list_path       = "governance/managed-naming.toml"   # 已建（H0=A2，见 C-074）
criteria        = ["H0-P 清单内新增公开命名必须带 term_id", "H0-D 清单分母必须 > 0", "H0-W 判据必须被 pre-commit/屏调用"]
mutation        = "清单内加一个不带 term_id 的 pub enum 变体 ⇒ 红；清单清空 ⇒ 红（分母 0）；删调用点 ⇒ 红"
status          = "implemented"
