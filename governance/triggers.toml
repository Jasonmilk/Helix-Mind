# sidecar 触发器表 —— 台账仍给人读，机器读这一份。
#
# 两类，不是一个表（缺了这条就会造出宽条件来消除 NO-REVISIT-ON）：
#   [C-xxx]            = 原子条件（paths / tests / commands 之一）⇒ lint 正常判 NO-REVISIT-ON
#   [C-xxx.manual]     = 机器判不了，**显式承认**；lint 不判，但单独列清单给人看
#
# 禁用词（命中一切 = 永远在响 = 不会响，C-047 第一版就栽在这）：任何 / 相关 / 需要时
#
# 每条必带 owner：只有人能改的（权威卷/架构裁决）标 gardener，其余标 pi。

