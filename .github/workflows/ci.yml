# helix-mind · 真判据 CI（R12；2026-10-10 重写）
#
# ★ 重写理由（实测）：上一版把 python 直接嵌进 YAML 的 run 块 ⇒ **YAML 少一个缩进就整份非法**
#   ⇒ 症状是 **workflow 有 0 个 job**、run 的 name 显示成文件路径（查不到，看起来像"跑失败了"）。
#   ⇒ **换一种不再需要小心的组织方式**：YAML 只调用脚本，脚本自己管缩进与引号。
# ★ 平台钉住：ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26 ⇒ 钉 24.04（**不让外部变更决定我们的红绿**）
name: ci
on:
  push:
    branches: ["**"]   # ★ 2026-10-25：**tag 不触发 CI** —— 归档快照 tag（helixECO-before-cleanup-…）指向旧状态，跑必红 ⇒ 警报疲劳源
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ⓪ 系统依赖（prost-build 需要 protoc —— 与 FlowModus 同一病同一修法）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: ⓪·4 报告头不得死（生成器完整性 · CI 只判"死不死"）
        # ★ 为什么在 CI：报告头生成器曾被两处 `$var（` 静默打死，而**没有 CI 断言它跑完**。
        #   CI 只 checkout 本仓（无五仓兄弟）⇒ 光/预算等段天然取不到 ⇒ 故只断言【跑完 + 自证行在】。
        run: bash tools/check-report-head.sh --death-only
      - name: ① ADR 头解析（每份都要 ok）
        run: bash tools/check-adr-heads.sh
      - name: ②·2 术语准入层（H2/H3 + admitted_unresolved=0）
        # ★ 为什么在 CI 而不只在前台：pre-commit 只在改 terms.toml 时触发（H4 的入口漏斗），
        #   而 CI 每次都会跑 ⇒ 准入层判据**在 CI 上不会恒绿**（它读真词表，违规即 rc=1）。
        run: python3 tools/check-terms.py --naming
      - name: ②·3 编排仓生成段 —— **CI 不可量（具名）**
        # 实测：GitHub Actions 只 checkout 本仓 ⇒ `../thinking/…` 恒不存在 ⇒ docgen 在此**永远 SKIP**。
        # 恒 SKIP 的 step 是"绿着守非生产对象"，比不加更坏 ⇒ 本 step 只做一件事：把不可量说清楚。
        # docgen 的真实消费方是**读时**：`thinking/phyt-DNA的任务编排思路/tools/docgen.py` + 合拢屏。
        run: echo "UNMEASURABLE: 编排仓不在 CI 检出范围内 —— docgen 由读时（屏/docgen.py）执行，CI 不判"
      - name: ②·5 文档不得落后于代码（分支地图生成物比对）
        run: bash tools/branch-map.sh --check
      - name: ② 脚本语法自检
        run: for f in tools/*.sh tools/hooks/*; do [ -f "$f" ] && bash -n "$f" || true; done
      - name: ③ Rust workspace 测试（本仓 20+ crates ⇒ 比 ADR 头强得多的真门）
        run: |
          set +e
          cargo test --all-features --no-fail-fast 2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            echo "--- 末尾 150 行 ---"; tail -150 /tmp/test.log
            { echo '## 失败尾部'; echo '```'; tail -120 /tmp/test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
            # ★ 失败必须【在机器读得到的地方具名】(2026-10-10)：
            #   logs 端点需 admin(403) · artifacts 需凭据(401) · job summary 的 API output.summary 为 null
            #   而 **annotations 公开可读** ⇒ 把失败行写成 ::error ⇒ 读数不再依赖人肉粘贴。
            grep -aE "^test .* FAILED|^failures:$|panicked at|^error(\[|:)|No such file|NotFound" /tmp/test.log \
              | head -12 | while IFS= read -r _l; do
                  echo "::error title=失败具名::$(printf %s "$_l" | tr -d "\r" | cut -c1-400)"
                done
          fi
          exit $rc
